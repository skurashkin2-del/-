name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive
        run: |
          set -o pipefail
          xcodebuild -project ToDoList.xcodeproj \
            -scheme ToDoList \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ToDoList.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO 2>&1 | tee xcodebuild.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/ToDoList.xcarchive/Products/Applications/ToDoList.app Payload/
          zip -qr ToDoList.ipa Payload
          ls -lh ToDoList.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoList-IPA
          path: ToDoList.ipa
          retention-days: 14

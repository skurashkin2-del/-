name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          ls -ld /Applications/Xcode* || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive
        run: |
          set -o pipefail
          xcodebuild -project ToDoList.xcodeproj \
            -scheme ToDoList \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/ToDoList.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual 2>&1 | tee xcodebuild.log || {
              grep -i -E "error:" xcodebuild.log | head -n 20 | while IFS= read -r line; do
                echo "::error::$line"
              done
              tail -n 40 xcodebuild.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/ToDoList.xcarchive/Products/Applications/ToDoList.app Payload/
          zip -qr ToDoList.ipa Payload
          ls -lh ToDoList.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToDoList-IPA
          path: ToDoList.ipa
          retention-days: 14

      - name: Publish to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Мой План (Latest IPA)"
          body: "Прямая ссылка на скачивание актуального .ipa файла приложения. Не требует входа в GitHub!"
          files: ToDoList.ipa
